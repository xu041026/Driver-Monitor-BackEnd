# Example only: replace the domain, certificate files and storage path.
# No certificates are included. Load this file inside Nginx's http context.
# Django: DEBUG=0, HTTPS=1, allowed host and CSRF origin set to the real domain.
# Waitress must listen only on 127.0.0.1:8000 and trust that exact proxy address
# for x-forwarded-proto. Do not expose the application port to other machines.

server {
    listen 80;
    server_name monitor.example.com;
    client_max_body_size 6m;
    return 308 https://monitor.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name monitor.example.com;

    # Replace with your own certificate and private key paths.
    ssl_certificate /etc/ssl/driver-monitor/REPLACE-fullchain.pem;
    ssl_certificate_key /etc/ssl/driver-monitor/REPLACE-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Matches the application's maximum complete JSON request size.
    client_max_body_size 6m;

    location /static/ {
        # Created by manage.py collectstatic with the matching DMS_DATA_DIR.
        alias /var/lib/driver-monitor-backend/static/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
    }

    # Never expose the evidence storage directory as public static files.
    # Authenticated /events/.../evidence/ routes continue through the app below.
    location /media/ { return 404; }
    location /evidence/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
